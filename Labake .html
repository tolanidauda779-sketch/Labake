<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question for Labake ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; color: #54243b;
      background: radial-gradient(circle at top, #fff4f7, #ffd9e5 55%, #f7b8cf);
      overflow: hidden;
    }
    .card {
      width: min(100%, 470px); text-align: center; padding: 42px 28px;
      background: rgba(255,255,255,.88); border: 1px solid #fff;
      border-radius: 28px; box-shadow: 0 20px 60px rgba(126,35,75,.18);
      position: relative; z-index: 1;
    }
    .heart { font-size: 56px; animation: beat 1.2s infinite; }
    h1 { font-size: clamp(30px, 8vw, 42px); margin: 14px 0; }
    p { font-size: 18px; line-height: 1.6; margin: 12px 0 26px; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 999px; padding: 14px 25px;
      font-size: 17px; font-weight: 700; cursor: pointer; transition: transform .2s;
    }
    button:hover { transform: translateY(-3px); }
    #yes { color: white; background: #e64d83; box-shadow: 0 8px 20px #e64d8344; }
    #no { color: #9c4164; background: #ffe3ed; }
    #response { min-height: 30px; margin-top: 22px; font-weight: 700; color: #d13e75; }
    .small { font-size: 13px; color: #9a6a7d; margin-top: 24px; }
    .float { position: fixed; bottom: -30px; font-size: 22px; opacity: .55; animation: rise 8s linear infinite; }
    @keyframes beat { 50% { transform: scale(1.14); } }
    @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>
    <h1>Hey, Labake!</h1>
    <p>There's something I've been wanting to ask you…</p>
    <h2>Will you be my girlfriend? 🥹❤️</h2>
    <div class="buttons">
      <button id="yes" onclick="answerYes()">Yes! 💕</button>
      <button id="no" onclick="answerNo()">No</button>
    </div>
    <div id="response" aria-live="polite"></div>
    <div class="small">Made with a little courage and a lot of affection.</div>
  </main>
  <script>
    function answerYes() {
      document.getElementById('response').textContent =
        "You just made me the happiest person! ❤️🥰";
      for (let i = 0; i < 24; i++) {
        const heart = document.createElement('span');
        heart.className = 'float';
        heart.textContent = ['💗','💕','❤️','💖'][i % 4];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 9000);
      }
    }
    function answerNo() {
      document.getElementById('response').textContent =
        "That's okay, Labake. Thank you for being honest. ❤️";
    }
  </script>
</body>
</html>
